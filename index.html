<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Halflives</title>
    <meta name="description" content="Compare drug levels over time: absorption, elimination, steady state, metabolites, interactions." />
    <link rel="stylesheet" href="vendor/uPlot.min.css" />
    <style>
      :root {
        --bg: #fbfbfd;
        --panel: #ffffff;
        --text: #1d1f24;
        --muted: #6b7080;
        --line: #e3e5ec;
        --accent: #6741d9;
        --warn-bg: #fff4e6;
        --warn: #8a4b00;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121318;
          --panel: #1b1d24;
          --text: #e8e9ee;
          --muted: #9a9fb0;
          --line: #2c2f3a;
          --accent: #9775fa;
          --warn-bg: #2b2112;
          --warn: #ffc078;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
      header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
      h1 { font-size: 1.3rem; margin: 0; }
      .disclaimer { color: var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 4px 10px; font-size: 0.85rem; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; align-items: center; }
      label { display: inline-flex; gap: 6px; align-items: center; }
      select, input, button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-height: 40px; padding: 4px 10px; }
      input[type="checkbox"] { min-height: auto; width: 20px; height: 20px; accent-color: var(--accent); }
      input[type="color"] { padding: 2px; width: 44px; }
      input[type="number"] { width: 6.5em; }
      button { cursor: pointer; }
      button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
      main { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 16px; padding: 0 16px 24px; align-items: start; }
      #plot { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; min-width: 0; }
      #chart { width: 100%; }
      #cards { display: grid; gap: 10px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 12px; padding: 10px; display: grid; gap: 8px; }
      .card.off { opacity: 0.6; }
      .card.off > :not(:first-child) { display: none; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .row .grow { flex: 1; min-width: 8em; }
      .small { font-size: 0.82rem; color: var(--muted); }
      details > summary { cursor: pointer; color: var(--accent); min-height: 32px; display: flex; align-items: center; }
      table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
      th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
      .scroll { overflow-x: auto; }
      .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
      dialog { max-width: min(900px, 94vw); max-height: 88vh; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); padding: 0; }
      dialog .body { padding: 8px 20px 20px; overflow: auto; max-height: calc(88vh - 56px); }
      dialog header { position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line); justify-content: space-between; }
      dialog code, dialog pre { background: var(--bg); border-radius: 4px; padding: 0 4px; }
      dialog pre { padding: 8px; overflow-x: auto; }
      a { color: var(--accent); }
      .u-legend { font-size: 0.8rem; text-align: left; }
      @media (max-width: 767px) {
        main { grid-template-columns: 1fr; }
        #plot { order: -1; position: sticky; top: 0; z-index: 2; }
        .u-legend { display: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Halflives</h1>
      <span class="disclaimer">Educational model, not medical advice. Real levels vary a lot between people.</span>
    </header>
    <div class="toolbar">
      <label>Range
        <select data-view="rangeH">
          <option value="24">1 day</option><option value="72">3 days</option><option value="96">4 days</option>
          <option value="168">1 week</option><option value="336">2 weeks</option><option value="720">30 days</option>
        </select>
      </label>
      <label>Y
        <select data-view="yMode"><option value="normalized">% of own peak</option><option value="amount">amount (mg)</option></select>
      </label>
      <label><input type="checkbox" data-view="showMean" /> mean</label>
      <label><input type="checkbox" data-view="showAvg" /> rolling avg</label>
      <label>Interactions
        <select data-view="interactions"><option value="off">off</option><option value="typical">typical</option><option value="worst">worst case</option></select>
      </label>
      <button type="button" data-act="import">Import</button>
      <button type="button" data-act="export">Export</button>
      <button type="button" data-act="link">Copy link</button>
      <button type="button" data-act="reset">Reset</button>
      <button type="button" data-doc="formulas">Formulas</button>
      <button type="button" data-doc="presets">Sources</button>
      <button type="button" data-doc="interactions">Interactions</button>
      <input type="file" id="file" accept="application/json,.json" hidden />
    </div>
    <main>
      <aside>
        <div id="cards"></div>
        <div class="row" style="margin-top: 10px">
          <select id="add-sub" class="grow" aria-label="Substance to add"></select>
          <button type="button" class="primary" data-act="add">+ Add</button>
          <button type="button" data-act="custom" title="Copy the selected substance as an editable custom one">+ Custom</button>
        </div>
        <details style="margin-top: 10px">
          <summary>Interaction factors</summary>
          <div class="scroll"><table id="ix"></table></div>
          <p class="small">Factor on elimination rate (ke) or bioavailability (F). Worst case: all active perpetrators at peak effect at once, multiplied.</p>
        </details>
      </aside>
      <section id="plot">
        <div id="chart"></div>
        <div class="scroll"><table id="stats"></table></div>
        <p class="small" id="msg"></p>
      </section>
    </main>
    <dialog id="doc">
      <header><strong id="doc-title"></strong><button type="button" data-act="close">Close</button></header>
      <div class="body" id="doc-body"></div>
    </dialog>
    <script src="vendor/uPlot.iife.min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
